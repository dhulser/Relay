name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Apple Silicon runner with the macOS 26 SDK, which SpeechAnalyzer needs.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate the project
        run: xcodegen generate

      # No signing identity on the runner: sign ad hoc. The embedded sherpa
      # dylib and the Sparkle framework are re-signed the same way.
      - name: Build and test
        run: |
          set -o pipefail
          xcodebuild -project Relay.xcodeproj -scheme Relay \
            -configuration Debug -derivedDataPath build test \
            CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= \
            PROVISIONING_PROFILE_SPECIFIER= \
            | grep -E "error:|warning:.*\.swift|Test Case.*(failed)|Executed|BUILD|TEST" | grep -v Vendor/
