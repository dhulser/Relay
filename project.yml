name: Relay

options:
  bundleIdPrefix: co.kevel
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  # In-app updates. The appcast is published alongside each GitHub release;
  # scripts/release.sh signs it with the EdDSA key generate_keys created.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.0

targets:
  Relay:
    type: application
    platform: macOS
    sources:
      - path: Relay
    dependencies:
      - sdk: Accelerate.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      # Speaker embeddings. Ships as a dylib, so it is embedded and re-signed
      # into the app bundle. See scripts/fetch-sherpa.sh to update it.
      - framework: Vendor/sherpa/sherpa-onnx.xcframework
        embed: true
        codeSign: true
      - package: Sparkle
    entitlements:
      path: Relay/Relay.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
    info:
      path: Relay/Info.plist
      properties:
        CFBundleIconFile: Relay
        NSAudioCaptureUsageDescription: Relay reads the audio your Mac is playing so it can put translated subtitles on screen.
        NSMicrophoneUsageDescription: Relay only listens to your microphone when you choose it as the source, to subtitle a conversation in the room.
        SUFeedURL: https://github.com/dhulser/Relay/releases/latest/download/appcast.xml
        SUPublicEDKey: cngR4yoPAQbZOXdYFHNfLSV+LqkW0jaazcaOjVwUATc=
        SUEnableInstallerLauncherService: false
        # relay://activate?token=… hands the Relay Hosted token back after checkout.
        CFBundleURLTypes:
          - CFBundleURLName: co.kevel.Relay.activate
            CFBundleURLSchemes: [relay]
        CFBundleName: Relay
        CFBundleDisplayName: Relay
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Menu-bar-only app: no Dock icon, no main window.
        LSUIElement: true
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: "© 2026 Dylan Hulser"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.kevel.Relay
        PRODUCT_NAME: Relay
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "3"
        # Manual signing with the existing "Apple Development" identity. A stable
        # signature keeps the system-audio permission across rebuilds, which
        # ad-hoc signing would not.
        DEVELOPMENT_TEAM: 4PJ4624484
        CODE_SIGN_STYLE: Manual
        PROVISIONING_PROFILE_SPECIFIER: ""
        # Swift 5 language mode: async/await works, but we skip Swift 6's
        # strict data-race checking, which would be pure friction for an MVP.
        SWIFT_VERSION: "5.0"
        # Apple Silicon only: the vendored whisper.cpp libraries are arm64,
        # built for Metal and the Neural Engine. An x86_64 slice could not link
        # and would lose the acceleration that makes local transcription viable.
        ARCHS: arm64
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        # Vendored whisper.cpp — see scripts/build-whisper.sh to rebuild.
        SWIFT_OBJC_BRIDGING_HEADER: Relay/Whisper/WhisperBridge.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/Vendor/whisper/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/Vendor/whisper/lib
        OTHER_LDFLAGS: -lwhisper -lggml -lggml-base -lggml-cpu -lggml-metal -lggml-blas -lc++
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/Vendor/sherpa
      configs:
        # Debug iterates with the development cert — no timestamp server, no
        # notarization, fast rebuilds.
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
          OTHER_CODE_SIGN_FLAGS: "--timestamp=none"
        # Release is what ships. Notarization rejects a build without a secure
        # timestamp, and rejects one carrying get-task-allow — the entitlement
        # that permits attaching a debugger, which Xcode injects by default.
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

  RelayTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: Relay
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.kevel.RelayTests
        DEVELOPMENT_TEAM: 4PJ4624484
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        # @testable import pulls in the app's bridging header, so the test
        # target needs to find whisper.h too.
        HEADER_SEARCH_PATHS: $(SRCROOT)/Vendor/whisper/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/Vendor/whisper/lib

schemes:
  Relay:
    build:
      targets:
        Relay: all
        RelayTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - RelayTests
