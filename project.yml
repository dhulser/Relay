name: LiveTranslator

options:
  bundleIdPrefix: co.kevel
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

targets:
  LiveTranslator:
    type: application
    platform: macOS
    sources:
      - path: LiveTranslator
    dependencies:
      - sdk: Accelerate.framework
      - sdk: Metal.framework
      - sdk: MetalKit.framework
      # Speaker embeddings. Ships as a dylib, so it is embedded and re-signed
      # into the app bundle. See scripts/fetch-sherpa.sh to update it.
      - framework: Vendor/sherpa/sherpa-onnx.xcframework
        embed: true
        codeSign: true
    entitlements:
      path: LiveTranslator/LiveTranslator.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.network.client: true
    info:
      path: LiveTranslator/Info.plist
      properties:
        CFBundleName: Live Translator
        CFBundleDisplayName: Live Translator
        # Menu-bar-only app: no Dock icon, no main window.
        LSUIElement: true
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.kevel.LiveTranslator
        PRODUCT_NAME: LiveTranslator
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        # Manual signing with the existing "Apple Development" identity. A stable
        # signature keeps the Screen Recording TCC grant across rebuilds, which
        # ad-hoc signing would not.
        DEVELOPMENT_TEAM: 4PJ4624484
        CODE_SIGN_STYLE: Manual
        PROVISIONING_PROFILE_SPECIFIER: ""
        # Swift 5 language mode: async/await works, but we skip Swift 6's
        # strict data-race checking, which would be pure friction for an MVP.
        SWIFT_VERSION: "5.0"
        # Apple Silicon only: the vendored whisper.cpp libraries are arm64,
        # built for Metal and the Neural Engine. An x86_64 slice could not link
        # and would lose the acceleration that makes local transcription viable.
        ARCHS: arm64
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        # Vendored whisper.cpp — see scripts/build-whisper.sh to rebuild.
        SWIFT_OBJC_BRIDGING_HEADER: LiveTranslator/Whisper/WhisperBridge.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/Vendor/whisper/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/Vendor/whisper/lib
        OTHER_LDFLAGS: -lwhisper -lggml -lggml-base -lggml-cpu -lggml-metal -lggml-blas -lc++
        FRAMEWORK_SEARCH_PATHS: $(SRCROOT)/Vendor/sherpa
      configs:
        # Debug iterates with the development cert — no timestamp server, no
        # notarization, fast rebuilds.
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
          OTHER_CODE_SIGN_FLAGS: "--timestamp=none"
        # Release is what ships. Notarization rejects a build without a secure
        # timestamp, and rejects one carrying get-task-allow — the entitlement
        # that permits attaching a debugger, which Xcode injects by default.
        Release:
          CODE_SIGN_IDENTITY: "Developer ID Application"
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

  LiveTranslatorTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: LiveTranslator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: co.kevel.LiveTranslatorTests
        DEVELOPMENT_TEAM: 4PJ4624484
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        # @testable import pulls in the app's bridging header, so the test
        # target needs to find whisper.h too.
        HEADER_SEARCH_PATHS: $(SRCROOT)/Vendor/whisper/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/Vendor/whisper/lib

schemes:
  LiveTranslator:
    build:
      targets:
        LiveTranslator: all
        LiveTranslatorTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - LiveTranslatorTests
